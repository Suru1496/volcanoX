<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcano Plot Generator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Lucide icons as simple SVG components
        const Upload = ({ size = 24, color = "currentColor", style }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        );

        const Download = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const Settings = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m-6-6h6m6 0h-6"></path>
            </svg>
        );

        const Info = ({ size = 24, color = "currentColor", style }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        );

        const AlertCircle = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        function VolcanoPlotGenerator() {
            const [data, setData] = useState(null);
            const [config, setConfig] = useState({
                foldChangeThreshold: 1.0,
                pValueThreshold: 0.05,
                pointSize: 4,
                upColor: '#e74c3c',
                downColor: '#3498db',
                nsColor: '#95a5a6',
                showLabels: true,
                labelTop: 10,
                title: 'Volcano Plot',
                xLabel: 'log2(Fold Change)',
                yLabel: '-log10(p-value)'
            });
            const [showSettings, setShowSettings] = useState(false);
            const [selectedGenes, setSelectedGenes] = useState(new Set());
            const canvasRef = useRef(null);
            const [error, setError] = useState(null);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const parsed = parseCSV(text);
                        setData(parsed);
                        setError(null);
                    } catch (err) {
                        setError(`Error parsing CSV: ${err.message}`);
                    }
                };
                reader.readAsText(file);
            };

            const parseCSV = (text) => {
                const lines = text.trim().split('\n');
                if (lines.length < 2) throw new Error('CSV file must have at least a header and one data row');

                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                
                const geneIdx = headers.findIndex(h => h.includes('gene') || h.includes('name') || h.includes('id'));
                const fcIdx = headers.findIndex(h => h.includes('fold') || h.includes('fc') || h.includes('log2fc'));
                const pIdx = headers.findIndex(h => h.includes('pvalue') || h.includes('p.value') || h.includes('p-value'));

                if (geneIdx === -1 || fcIdx === -1 || pIdx === -1) {
                    throw new Error('CSV must contain columns for gene name, fold change, and p-value');
                }

                const parsedData = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(',').map(v => v.trim());
                    if (values.length < 3) continue;

                    const gene = values[geneIdx];
                    const foldChange = parseFloat(values[fcIdx]);
                    const pValue = parseFloat(values[pIdx]);

                    if (gene && !isNaN(foldChange) && !isNaN(pValue) && pValue > 0) {
                        parsedData.push({ gene, foldChange, pValue });
                    }
                }

                if (parsedData.length === 0) {
                    throw new Error('No valid data rows found');
                }

                return parsedData;
            };

            const drawPlot = () => {
                if (!data || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);

                const margin = { top: 60, right: 40, bottom: 60, left: 70 };
                const plotWidth = width - margin.left - margin.right;
                const plotHeight = height - margin.top - margin.bottom;

                const fcValues = data.map(d => d.foldChange);
                const negLogP = data.map(d => -Math.log10(d.pValue));
                
                const xMin = Math.min(...fcValues, -config.foldChangeThreshold - 1);
                const xMax = Math.max(...fcValues, config.foldChangeThreshold + 1);
                const yMax = Math.max(...negLogP) * 1.1;

                const xScale = (val) => margin.left + ((val - xMin) / (xMax - xMin)) * plotWidth;
                const yScale = (val) => margin.top + plotHeight - (val / yMax) * plotHeight;

                const pThreshold = -Math.log10(config.pValueThreshold);
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);

                ctx.beginPath();
                ctx.moveTo(margin.left, yScale(pThreshold));
                ctx.lineTo(margin.left + plotWidth, yScale(pThreshold));
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(xScale(-config.foldChangeThreshold), margin.top);
                ctx.lineTo(xScale(-config.foldChangeThreshold), margin.top + plotHeight);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(xScale(config.foldChangeThreshold), margin.top);
                ctx.lineTo(xScale(config.foldChangeThreshold), margin.top + plotHeight);
                ctx.stroke();

                ctx.setLineDash([]);

                const classified = data.map(d => {
                    const negLog = -Math.log10(d.pValue);
                    let category = 'ns';
                    
                    if (negLog > pThreshold) {
                        if (d.foldChange > config.foldChangeThreshold) category = 'up';
                        else if (d.foldChange < -config.foldChangeThreshold) category = 'down';
                    }

                    return { ...d, negLog, category };
                });

                classified.sort((a, b) => {
                    if (a.category === 'ns' && b.category !== 'ns') return -1;
                    if (a.category !== 'ns' && b.category === 'ns') return 1;
                    return 0;
                });

                classified.forEach(d => {
                    const x = xScale(d.foldChange);
                    const y = yScale(d.negLog);

                    ctx.fillStyle = d.category === 'up' ? config.upColor :
                                    d.category === 'down' ? config.downColor :
                                    config.nsColor;
                    
                    ctx.globalAlpha = d.category === 'ns' ? 0.3 : 0.7;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, config.pointSize, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.globalAlpha = 1;

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.moveTo(margin.left, margin.top + plotHeight);
                ctx.lineTo(margin.left + plotWidth, margin.top + plotHeight);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(margin.left, margin.top);
                ctx.lineTo(margin.left, margin.top + plotHeight);
                ctx.stroke();

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(config.title, width / 2, 30);

                ctx.font = '14px Arial';
                ctx.fillText(config.xLabel, width / 2, height - 20);

                ctx.save();
                ctx.translate(20, height / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText(config.yLabel, 0, 0);
                ctx.restore();

                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                const xTicks = 5;
                for (let i = 0; i <= xTicks; i++) {
                    const val = xMin + (xMax - xMin) * (i / xTicks);
                    const x = xScale(val);
                    
                    ctx.beginPath();
                    ctx.moveTo(x, margin.top + plotHeight);
                    ctx.lineTo(x, margin.top + plotHeight + 5);
                    ctx.stroke();
                    
                    ctx.fillText(val.toFixed(1), x, margin.top + plotHeight + 20);
                }

                ctx.textAlign = 'right';
                const yTicks = 5;
                for (let i = 0; i <= yTicks; i++) {
                    const val = yMax * (i / yTicks);
                    const y = yScale(val);
                    
                    ctx.beginPath();
                    ctx.moveTo(margin.left - 5, y);
                    ctx.lineTo(margin.left, y);
                    ctx.stroke();
                    
                    ctx.fillText(val.toFixed(1), margin.left - 10, y + 4);
                }

                if (config.showLabels) {
                    const topGenes = [...classified]
                        .filter(d => d.category !== 'ns')
                        .sort((a, b) => b.negLog - a.negLog)
                        .slice(0, config.labelTop);

                    ctx.font = 'bold 11px Arial';
                    ctx.fillStyle = '#000000';
                    ctx.textAlign = 'left';

                    topGenes.forEach(d => {
                        const x = xScale(d.foldChange);
                        const y = yScale(d.negLog);
                        ctx.fillText(d.gene, x + 6, y - 6);
                    });
                }

                const legendX = width - margin.right - 120;
                const legendY = margin.top + 20;
                
                const upCount = classified.filter(d => d.category === 'up').length;
                const downCount = classified.filter(d => d.category === 'down').length;
                const nsCount = classified.filter(d => d.category === 'ns').length;

                ctx.font = '12px Arial';
                ctx.textAlign = 'left';

                ctx.fillStyle = config.upColor;
                ctx.beginPath();
                ctx.arc(legendX, legendY, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.fillText(`Up-regulated (${upCount})`, legendX + 12, legendY + 4);

                ctx.fillStyle = config.downColor;
                ctx.beginPath();
                ctx.arc(legendX, legendY + 20, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.fillText(`Down-regulated (${downCount})`, legendX + 12, legendY + 24);

                ctx.fillStyle = config.nsColor;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(legendX, legendY + 40, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#000000';
                ctx.fillText(`Not significant (${nsCount})`, legendX + 12, legendY + 44);
            };

            useEffect(() => {
                if (data) {
                    drawPlot();
                }
            }, [data, config]);

            const exportPlot = (format) => {
                if (!canvasRef.current) return;

                if (format === 'png') {
                    const link = document.createElement('a');
                    link.download = 'volcano_plot.png';
                    link.href = canvasRef.current.toDataURL('image/png');
                    link.click();
                }
            };

            const exportData = () => {
                if (!data) return;

                const classified = data.map(d => {
                    const negLog = -Math.log10(d.pValue);
                    const pThreshold = -Math.log10(config.pValueThreshold);
                    let category = 'Not Significant';
                    
                    if (negLog > pThreshold) {
                        if (d.foldChange > config.foldChangeThreshold) category = 'Up-regulated';
                        else if (d.foldChange < -config.foldChangeThreshold) category = 'Down-regulated';
                    }

                    return {
                        Gene: d.gene,
                        'Log2 Fold Change': d.foldChange.toFixed(4),
                        'P-value': d.pValue.toExponential(3),
                        '-Log10 P-value': negLog.toFixed(4),
                        Category: category
                    };
                });

                const csv = [
                    Object.keys(classified[0]).join(','),
                    ...classified.map(row => Object.values(row).join(','))
                ].join('\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const link = document.createElement('a');
                link.download = 'volcano_plot_data.csv';
                link.href = URL.createObjectURL(blob);
                link.click();
            };

            return (
                <div style={{ 
                    minHeight: '100vh', 
                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    padding: '20px',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
                }}>
                    <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
                        <div style={{ 
                            background: 'white', 
                            borderRadius: '16px', 
                            padding: '30px',
                            marginBottom: '20px',
                            boxShadow: '0 8px 32px rgba(0,0,0,0.1)'
                        }}>
                            <h1 style={{ margin: '0 0 10px 0', color: '#2c3e50', fontSize: '32px' }}>
                                🌋 Volcano Plot Generator
                            </h1>
                            <p style={{ margin: 0, color: '#7f8c8d', fontSize: '16px' }}>
                                Upload your CSV data and generate publication-ready volcano plots
                            </p>
                        </div>

                        {!data && (
                            <div style={{
                                background: 'white',
                                borderRadius: '16px',
                                padding: '60px 30px',
                                textAlign: 'center',
                                boxShadow: '0 8px 32px rgba(0,0,0,0.1)'
                            }}>
                                <Upload size={64} color="#667eea" style={{ marginBottom: '20px' }} />
                                <h2 style={{ color: '#2c3e50', marginBottom: '10px' }}>Upload Your Data</h2>
                                <p style={{ color: '#7f8c8d', marginBottom: '30px' }}>
                                    CSV format: Gene name, Log2 Fold Change, P-value
                                </p>
                                <label style={{
                                    display: 'inline-block',
                                    padding: '15px 40px',
                                    background: '#667eea',
                                    color: 'white',
                                    borderRadius: '8px',
                                    cursor: 'pointer',
                                    fontSize: '16px',
                                    fontWeight: 'bold',
                                    transition: 'transform 0.2s'
                                }}
                                onMouseOver={(e) => e.currentTarget.style.transform = 'scale(1.05)'}
                                onMouseOut={(e) => e.currentTarget.style.transform = 'scale(1)'}
                                >
                                    Choose CSV File
                                    <input 
                                        type="file" 
                                        accept=".csv" 
                                        onChange={handleFileUpload}
                                        style={{ display: 'none' }}
                                    />
                                </label>

                                <div style={{
                                    marginTop: '40px',
                                    padding: '20px',
                                    background: '#f8f9fa',
                                    borderRadius: '8px',
                                    textAlign: 'left',
                                    maxWidth: '600px',
                                    margin: '40px auto 0'
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'start', gap: '10px' }}>
                                        <Info size={20} color="#3498db" style={{ flexShrink: 0, marginTop: '2px' }} />
                                        <div>
                                            <h3 style={{ margin: '0 0 10px 0', color: '#2c3e50', fontSize: '14px' }}>CSV Format Example:</h3>
                                            <pre style={{ 
                                                background: 'white', 
                                                padding: '15px', 
                                                borderRadius: '4px',
                                                fontSize: '12px',
                                                overflow: 'auto',
                                                margin: 0
                                            }}>
{`Gene,Log2FoldChange,Pvalue
BRCA1,2.5,0.001
TP53,-1.8,0.005
EGFR,3.2,0.0001
MYC,-2.1,0.002`}
                                            </pre>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {error && (
                            <div style={{
                                background: '#fee',
                                border: '1px solid #fcc',
                                borderRadius: '8px',
                                padding: '15px',
                                marginBottom: '20px',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px'
                            }}>
                                <AlertCircle size={20} color="#e74c3c" />
                                <span style={{ color: '#c0392b' }}>{error}</span>
                            </div>
                        )}

                        {data && (
                            <>
                                <div style={{
                                    background: 'white',
                                    borderRadius: '16px',
                                    padding: '20px',
                                    marginBottom: '20px',
                                    boxShadow: '0 8px 32px rgba(0,0,0,0.1)'
                                }}>
                                    <div style={{ 
                                        display: 'flex', 
                                        justifyContent: 'space-between', 
                                        alignItems: 'center',
                                        marginBottom: '20px',
                                        flexWrap: 'wrap',
                                        gap: '10px'
                                    }}>
                                        <h2 style={{ margin: 0, color: '#2c3e50' }}>Your Volcano Plot</h2>
                                        <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                                            <button
                                                onClick={() => setShowSettings(!showSettings)}
                                                style={{
                                                    padding: '10px 20px',
                                                    background: showSettings ? '#667eea' : 'white',
                                                    color: showSettings ? 'white' : '#667eea',
                                                    border: '2px solid #667eea',
                                                    borderRadius: '8px',
                                                    cursor: 'pointer',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    gap: '8px',
                                                    fontWeight: 'bold'
                                                }}
                                            >
                                                <Settings size={18} />
                                                Settings
                                            </button>
                                            <button
                                                onClick={() => exportPlot('png')}
                                                style={{
                                                    padding: '10px 20px',
                                                    background: '#27ae60',
                                                    color: 'white',
                                                    border: 'none',
                                                    borderRadius: '8px',
                                                    cursor: 'pointer',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    gap: '8px',
                                                    fontWeight: 'bold'
                                                }}
                                            >
                                                <Download size={18} />
                                                Export PNG
                                            </button>
                                            <button
                                                onClick={exportData}
                                                style={{
                                                    padding: '10px 20px',
                                                    background: '#3498db',
                                                    color: 'white',
                                                    border: 'none',
                                                    borderRadius: '8px',
                                                    cursor: 'pointer',
                                                    fontWeight: 'bold'
                                                }}
                                            >
                                                Export CSV
                                            </button>
                                        </div>
                                    </div>

                                    <canvas 
                                        ref={canvasRef} 
                                        width={1000} 
                                        height={700}
                                        style={{ 
                                            width: '100%', 
                                            height: 'auto',
                                            border: '1px solid #ecf0f1',
                                            borderRadius: '8px'
                                        }}
                                    />
                                </div>

                                {showSettings && (
                                    <div style={{
                                        background: 'white',
                                        borderRadius: '16px',
                                        padding: '30px',
                                        boxShadow: '0 8px 32px rgba(0,0,0,0.1)'
                                    }}>
                                        <h3 style={{ marginTop: 0, color: '#2c3e50' }}>Plot Settings</h3>
                                        
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '20px' }}>
                                            <div>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    Fold Change Threshold
                                                </label>
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    value={config.foldChangeThreshold}
                                                    onChange={(e) => setConfig({...config, foldChangeThreshold: parseFloat(e.target.value)})}
                                                    style={{
                                                        width: '100%',
                                                        padding: '10px',
                                                        border: '2px solid #ecf0f1',
                                                        borderRadius: '8px',
                                                        fontSize: '14px'
                                                    }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    P-value Threshold
                                                </label>
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    value={config.pValueThreshold}
                                                    onChange={(e) => setConfig({...config, pValueThreshold: parseFloat(e.target.value)})}
                                                    style={{
                                                        width: '100%',
                                                        padding: '10px',
                                                        border: '2px solid #ecf0f1',
                                                        borderRadius: '8px',
                                                        fontSize: '14px'
                                                    }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    Point Size: {config.pointSize}px
                                                </label>
                                                <input
                                                    type="range"
                                                    min="2"
                                                    max="10"
                                                    value={config.pointSize}
                                                    onChange={(e) => setConfig({...config, pointSize: parseInt(e.target.value)})}
                                                    style={{ width: '100%' }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    Top Genes to Label
                                                </label>
                                                <input
                                                    type="number"
                                                    min="0"
                                                    max="50"
                                                    value={config.labelTop}
                                                    onChange={(e) => setConfig({...config, labelTop: parseInt(e.target.value)})}
                                                    style={{
                                                        width: '100%',
                                                        padding: '10px',
                                                        border: '2px solid #ecf0f1',
                                                        borderRadius: '8px',
                                                        fontSize: '14px'
                                                    }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    Up-regulated Color
                                                </label>
                                                <input
                                                    type="color"
                                                    value={config.upColor}
                                                    onChange={(e) => setConfig({...config, upColor: e.target.value})}
                                                    style={{ width: '100%', height: '40px', border: 'none', borderRadius: '8px', cursor: 'pointer' }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    Down-regulated Color
                                                </label>
                                                <input
                                                    type="color"
                                                    value={config.downColor}
                                                    onChange={(e) => setConfig({...config, downColor: e.target.value})}
                                                    style={{ width: '100%', height: '40px', border: 'none', borderRadius: '8px', cursor: 'pointer' }}
                                                />
                                            </div>

                                            <div style={{ gridColumn: '1 / -1' }}>
                                                <label style={{ display: 'block', marginBottom: '8px', color: '#34495e', fontWeight: 'bold' }}>
                                                    Plot Title
                                                </label>
                                                <input
                                                    type="text"
                                                    value={config.title}
                                                    onChange={(e) => setConfig({...config, title: e.target.value})}
                                                    style={{
                                                        width: '100%',
                                                        padding: '10px',
                                                        border: '2px solid #ecf0f1',
                                                        borderRadius: '8px',
                                                        fontSize: '14px'
                                                    }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer' }}>
                                                    <input
                                                        type="checkbox"
                                                        checked={config.showLabels}
                                                        onChange={(e) => setConfig({...config, showLabels: e.target.checked})}
                                                        style={{ width: '20px', height: '20px', cursor: 'pointer' }}
                                                    />
                                                    <span style={{ color: '#34495e', fontWeight: 'bold' }}>Show Gene Labels</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<VolcanoPlotGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
